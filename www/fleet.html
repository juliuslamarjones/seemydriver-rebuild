<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col font-sans selection:bg-amber-400 selection:text-black antialiased">

    <header class="w-full border-b border-neutral-900 bg-black/90 backdrop-blur-md z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="w-11 h-11 bg-amber-400 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(251,191,36,0.5)] shrink-0 overflow-hidden">
                <span class="text-black font-black text-xl">👀</span>
            </div>
            <span class="font-black tracking-tight text-xl sm:text-2xl text-white">See<span class="text-amber-400">MyDriver</span> <span class="text-[10px] px-2.5 py-1 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20 ml-1.5 font-mono whitespace-nowrap">FLEET COMMAND</span></span>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <a href="index.html" class="text-xs font-black text-amber-400 hover:text-black bg-amber-400/10 hover:bg-amber-400 px-3.5 py-2 rounded-xl border border-amber-400/40 transition whitespace-nowrap">&times; Close Fleet</a>
            <span id="connection-status" class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20 hidden sm:flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live
            </span>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
        
        <aside class="w-full md:w-96 bg-[#0f1117] border-b md:border-b-0 md:border-r border-neutral-900 flex flex-col z-20 shrink-0 h-[50%] md:h-full overflow-y-auto">
            <div class="p-4 border-b border-neutral-900 flex flex-col gap-3 bg-black/40">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black uppercase tracking-wider text-neutral-400">Active Fleet Roster</span>
                    <span id="driver-count" class="text-xs bg-neutral-900 text-amber-400 px-3 py-1 rounded-full font-mono border border-neutral-800">0 Active</span>
                </div>
                <div class="relative">
                    <input type="text" id="fleet-search" oninput="filterRoster()" placeholder="Search drivers or destinations..." class="w-full bg-neutral-900/90 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-amber-400/50 font-mono transition-all">
                </div>
            </div>

            <div class="p-4 border-b border-neutral-900 bg-[#12141c]/60 flex flex-col gap-3 font-mono text-xs">
                <div class="font-black text-white text-xs flex items-center gap-2">🚀 NEW JOB DISPATCH CONTROL</div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">DRIVER NAME *</label>
                        <input type="text" id="modal-driver-name" placeholder="e.g. Marcus" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">DRIVER PHONE</label>
                        <input type="tel" id="modal-driver-phone" placeholder="8329025417" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">CUSTOMER NAME</label>
                        <input type="text" id="modal-cust-name" placeholder="John Smith" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">CUSTOMER PHONE</label>
                        <input type="tel" id="modal-cust-phone" placeholder="555-0142" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div class="relative">
                    <label class="text-neutral-400 block mb-1 text-[10px]">DESTINATION ADDRESS *</label>
                    <input type="text" id="modal-dest-address" oninput="window.handleAddressInput(this.value)" autocomplete="off" placeholder="Start typing address..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    <div id="address-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#161923] border border-neutral-800 rounded-xl shadow-2xl z-[99999] max-h-48 overflow-y-auto"></div>
                </div>

                <input type="hidden" id="modal-lat" value="29.9731">
                <input type="hidden" id="modal-lng" value="-95.2831">

                <button onclick="submitManualDispatch(true)" class="w-full bg-neutral-800 hover:bg-neutral-700 text-amber-400 font-black text-xs py-3 rounded-xl border border-neutral-700 transition-all cursor-pointer mt-3">📱 Text Driver & Deploy</button>
                <button onclick="submitManualDispatch(false)" class="w-full bg-amber-400 hover:bg-amber-500 text-black font-black text-xs py-2.5 rounded-xl transition-all shadow-md cursor-pointer">Deploy Only 🚀</button>
            </div>

            <div id="driver-list" class="flex-1 min-h-[220px] max-h-[45vh] md:max-h-none overflow-y-auto p-3.5 space-y-2.5">
                <div class="text-xs text-neutral-500 text-center py-8 font-mono">Listening for active broadcasts...</div>
            </div>

            <div class="px-3.5 py-2.5 border-t border-neutral-900 bg-black/50 flex items-center justify-between gap-2 font-mono text-[11px] shrink-0">
                <button onclick="resetFleetView()" class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-neutral-300 hover:text-white font-bold py-2 px-2.5 rounded-lg border border-neutral-800 transition cursor-pointer truncate">&#8634; Overview</button>
                <button onclick="purgeAllBroadcasts()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 font-bold py-2 px-2.5 rounded-lg border border-red-500/20 transition cursor-pointer shrink-0">&#128465;&#65039; Purge All</button>
            </div>
        </aside>

        <main class="flex-1 relative bg-neutral-200 h-[50%] min-h-[280px] md:h-full">
            <div id="map" class="absolute inset-0 w-full h-full z-0"></div>
            <div class="absolute bottom-4 left-3 right-3 z-20 flex flex-wrap items-center gap-2 font-mono text-xs pointer-events-auto">
                <button id="fleet-recenter-btn" onclick="recenterFleetMap()" class="bg-[#12141c]/95 hover:bg-neutral-800 text-white font-bold px-3.5 py-2 rounded-xl border border-neutral-700 shadow-lg cursor-pointer transition">Re-Center</button>
                <button id="fleet-fit-both-btn" onclick="fitBothFleetAndDest()" class="bg-amber-400 hover:bg-amber-300 text-black font-black px-3.5 py-2 rounded-xl shadow-lg cursor-pointer transition">Fit Both</button>
                <button id="fleet-overview-btn" onclick="resetFleetView()" class="bg-[#12141c]/95 hover:bg-neutral-800 text-neutral-200 font-bold px-3.5 py-2 rounded-xl border border-neutral-700 shadow-lg cursor-pointer transition">Overview</button>
                <button id="fleet-3d-btn" type="button" onclick="toggleFleet3D()" class="bg-[#12141c]/95 hover:bg-neutral-800 text-amber-400 font-bold px-3.5 py-2 rounded-xl border border-amber-400/40 shadow-lg cursor-pointer transition">3D: OFF</button>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAfT3ZCE8DEmjsf4FLIqDgdYIQL1woIJOI", authDomain: "seemydriver-prod.firebaseapp.com", databaseURL: "https://seemydriver-prod-default-rtdb.firebaseio.com", projectId: "seemydriver-prod", storageBucket: "seemydriver-prod.firebasestorage.app", messagingSenderId: "16366013329", appId: "1:16366013329:web:7e993e6ee37f940a04a064" };
        if (typeof firebase !== 'undefined' && !firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        if (typeof firebase !== 'undefined' && typeof window.db === 'undefined') { window.db = firebase.database(); }
        const DEV_BYPASS_MODE = true;
        let map = null;
        function getActiveAccountScope() {
            try {
                const email = (localStorage.getItem('smd_user_email') || '').trim().toLowerCase();
                if (email) return 'email_' + email.replace(/[^a-z0-9]+/g, '_');
                const u = (window.firebase && firebase.auth && firebase.auth().currentUser) || null;
                if (u && u.email) return 'email_' + String(u.email).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
                if (u && u.uid) return 'uid_' + String(u.uid).replace(/[^a-zA-Z0-9_-]/g, '_');
            } catch (e) {}
            return 'default_guest';
        }
        function getScopedFleetStorageKey() {
            return 'smd_fleet_broadcasts_v2_' + getActiveAccountScope();
        }
        function getScopedPersistKey() {
            return 'smd_fleet_sessions_v2_' + getActiveAccountScope();
        }
        function loadPersistedFleet() {
            try {
                if (getActiveAccountScope() === 'signed_out') return {};
                const raw = localStorage.getItem(getScopedFleetStorageKey());
                const parsed = raw ? JSON.parse(raw) : {};
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) { return {}; }
        }
        function savePersistedFleet(data) {
            try {
                if (getActiveAccountScope() === 'signed_out') return;
                localStorage.setItem(getScopedFleetStorageKey(), JSON.stringify(data || {}));
            } catch (e) {}
        }
        function readSavedDrivers() {
            try {
                if (getActiveAccountScope() === 'signed_out') return {};
                const raw = localStorage.getItem(getScopedPersistKey());
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) { return {}; }
        }
        function writeSavedDrivers(obj) {
            try {
                if (getActiveAccountScope() === 'signed_out') return;
                localStorage.setItem(getScopedPersistKey(), JSON.stringify(obj || {}));
            } catch (e) {}
        }
        function filterBroadcastsForCurrentAccount(rawMap) {
            const out = {};
            const activeEmail = (localStorage.getItem('smd_user_email') || '').trim().toLowerCase();
            if (!activeEmail) return out;
            Object.keys(rawMap || {}).forEach((sid) => {
                const item = rawMap[sid];
                if (!item || typeof item !== 'object') return;
                const itemEmail = (item.ownerEmail || item.email || '').trim().toLowerCase();
                if (itemEmail && itemEmail === activeEmail) {
                    out[sid] = item;
                }
            });
            return out;
        }
let fleetData = readSavedDrivers();
        let activeMarkers = {};
        let cachedDestLat = null;
        let cachedDestLng = null;
        let geocodeTimer = null;
        let lastGeocodePickAt = 0;
        window.MAPBOX_TOKEN = window.MAPBOX_TOKEN || 'pk.eyJ1Ijoic29ubnlqb25lczIwMTQiLCJhIjoiY212NHExMmxjMTBmODJ3cHh5cmcxbmZyZSJ9.wq8EANp8vooYz3gE2o4Krg';
        if (typeof mapboxgl !== 'undefined') { mapboxgl.accessToken = window.MAPBOX_TOKEN; }
        const FULL_MAPBOX_TOKEN = window.MAPBOX_TOKEN;

        function verifyUpgradeAccess() {
            if (DEV_BYPASS_MODE) return;
            const user = firebase.auth().currentUser;
            if (!user) {
                if (DEV_BYPASS_MODE) {
                    document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting...';
                    firebase.auth().signInAnonymously().then(() => { attachBroadcastsListener(); }).catch((err) => {
                        console.error('Anon auth error (enable Anonymous provider in Firebase Auth):', err);
                        document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Auth Blocked';
                    });
                    return;
                }
                document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Sign In Required';
                return;
            }
            map.easeTo({ center: [-95.2831, 29.9731], zoom: 12, duration: 500 });
        };

        window.fitBothFleetAndDest = function () {
            if (!map || typeof mapboxgl === 'undefined') return;
            const bounds = new mapboxgl.LngLatBounds();
            let hasPoint = false;
            Object.values(fleetData || {}).forEach((d) => {
                const lat = parseFloat(d && d.lat), lng = parseFloat(d && d.lng);
                if (isFinite(lat) && isFinite(lng)) { bounds.extend([lng, lat]); hasPoint = true; }
            });
            if (isFinite(cachedDestLat) && isFinite(cachedDestLng)) {
                bounds.extend([cachedDestLng, cachedDestLat]);
                hasPoint = true;
            }
            if (hasPoint && !bounds.isEmpty()) {
                map.fitBounds(bounds, { padding: 70, maxZoom: 15, duration: 600 });
            } else {
                window.recenterFleetMap();
            }
        };

        function initMap() {
            if (map) return;
            verifyUpgradeAccess();
            try {
                window.map = window.map = map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v12',
                    center: [-95.2831, 29.9731],
                    zoom: 12
                });
            } catch (e) {
                window.map = window.map = map = new mapboxgl.Map({
                    container: 'map',
                    style: {
                        version: 8,
                        sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
                        layers: [{ id: 'osm-layer', type: 'raster', source: 'osm' }]
                    },
                    center: [-95.2831, 29.9731],
                    zoom: 12
                });
            }
            map.on('error', function () {
                if (!map._fallbackApplied) {
                    map._fallbackApplied = true;
                    map.setStyle({
                        version: 8,
                        sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
                        layers: [{ id: 'osm-layer', type: 'raster', source: 'osm' }]
                    });
                }
            });
            map.addControl(new mapboxgl.NavigationControl(), 'top-right');
            map.on('load', function () { map.resize(); initFirebaseListeners(); });
            setTimeout(function () { if (map) map.resize(); }, 200);
            setTimeout(function () { if (map) map.resize(); }, 800);
            if (typeof ResizeObserver !== 'undefined') {
                const mapEl = document.getElementById('map');
                if (mapEl) {
                    new ResizeObserver(function () { if (map) map.resize(); }).observe(mapEl);
                }
            }
            window.addEventListener('orientationchange', function () { setTimeout(function () { if (map) map.resize(); }, 250); });
            document.addEventListener('visibilitychange', function () { if (!document.hidden && map) map.resize(); });
        }

        window.handleAddressInput = async function(value) {
            cachedDestLat = null;
            cachedDestLng = null;

            const suggestions = document.getElementById('address-suggestions');
            if (!suggestions) return;

            clearTimeout(geocodeTimer);
            const query = (value || '').trim();

            if (query.length < 3) {
                suggestions.classList.add('hidden');
                suggestions.style.display = 'none';
                suggestions.innerHTML = '';
                return;
            }

            geocodeTimer = setTimeout(async () => {
                try {
                    let proxParam = '';
                    if (map && typeof map.getCenter === 'function') {
                        const c = map.getCenter();
                        if (c && isFinite(c.lng) && isFinite(c.lat)) {
                            proxParam = '&proximity=' + c.lng.toFixed(4) + ',' + c.lat.toFixed(4);
                        }
                    }

                    let items = [];
                    const mbRes = await fetch('https://api.mapbox.com/geocoding/v5/mapbox.places/' + encodeURIComponent(query) + '.json?access_token=' + FULL_MAPBOX_TOKEN + '&autocomplete=true&limit=6' + proxParam);
                    if (mbRes.ok) {
                        const mbData = await mbRes.json();
                        if (mbData && Array.isArray(mbData.features) && mbData.features.length > 0) {
                            items = mbData.features.map(f => ({
                                name: f.place_name || f.text || '',
                                coords: f.center || (f.geometry && f.geometry.coordinates) || [0, 0]
                            }));
                        }
                    }

                    if (items.length === 0) {
                        let pUrl = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&limit=6';
                        if (map && typeof map.getCenter === 'function') {
                            const c = map.getCenter();
                            if (c && isFinite(c.lng) && isFinite(c.lat)) {
                                pUrl += '&lat=' + c.lat.toFixed(4) + '&lon=' + c.lng.toFixed(4);
                            }
                        }
                        const pRes = await fetch(pUrl);
                        if (pRes.ok) {
                            const pData = await pRes.json();
                            if (pData && Array.isArray(pData.features)) {
                                items = pData.features.map(f => {
                                    const props = f.properties || {};
                                    const label = [props.name, props.housenumber, props.street, props.city, props.state, props.postcode].filter(Boolean).join(', ') || props.label || query;
                                    const coords = (f.geometry && Array.isArray(f.geometry.coordinates)) ? f.geometry.coordinates : [0, 0];
                                    return { name: label, coords: coords };
                                }).filter(x => x.name);
                            }
                        }
                    }

                    suggestions.innerHTML = '';
                    if (items.length === 0) {
                        suggestions.classList.add('hidden');
                        suggestions.style.display = 'none';
                        return;
                    }

                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = "px-3 py-2.5 text-xs text-neutral-200 hover:bg-neutral-800 hover:text-amber-400 cursor-pointer border-b border-neutral-800/80 transition font-medium";
                        div.innerText = item.name;
                        div.onpointerdown = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            lastGeocodePickAt = Date.now();
                            const inputField = document.getElementById('modal-dest-address');
                            if (inputField) inputField.value = item.name;

                            cachedDestLat = item.coords[1];
                            cachedDestLng = item.coords[0];

                            const latField = document.getElementById('modal-lat');
                            const lngField = document.getElementById('modal-lng');
                            if (latField) latField.value = cachedDestLat;
                            if (lngField) lngField.value = cachedDestLng;

                            suggestions.classList.add('hidden');
                            suggestions.style.display = 'none';
                        };
                        suggestions.appendChild(div);
                    });

                    suggestions.classList.remove('hidden');
                    suggestions.style.display = 'block';
                } catch (e) {
                    console.error('Fleet geocoder lookup error:', e);
                }
            }, 250);
        };

        function attachBroadcastsListener() {
            const statusEl = document.getElementById('connection-status');
            if (!window.db || typeof db.ref !== 'function') return;
            const broadcastsRef = db.ref('broadcasts');
            broadcastsRef.off();
            broadcastsRef.on('value', (snapshot) => {
                if (statusEl) statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live';
                const remoteData = filterBroadcastsForCurrentAccount(snapshot.val() || {});
                const savedLocal = (typeof readSavedDrivers === 'function') ? readSavedDrivers() : {};
                const mergedRoster = Object.assign({}, savedLocal, remoteData);
                window.fleetData = window.fleetData = fleetData = mergedRoster;
                if (typeof writeSavedDrivers === 'function') writeSavedDrivers(fleetData);
                renderFleetRosterAndMarkers();
            }, (error) => {
                console.warn('RTDB read fallback to persisted local roster:', error && error.message ? error.message : error);
                if (statusEl) statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sync';
                if (typeof readSavedDrivers === 'function') {
                    window.fleetData = window.fleetData = fleetData = readSavedDrivers();
                    renderFleetRosterAndMarkers();
                }
            });
        }

        function initFirebaseListeners() {
            firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                if (DEV_BYPASS_MODE) {
                    const statusEl = document.getElementById('connection-status');
                    if (statusEl) statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting...';
                    firebase.auth().signInAnonymously().catch((err) => {
                        console.error('Anon auth error:', err);
                        if (statusEl) statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Auth Blocked';
                    });
                    return;
                }
                const statusEl = document.getElementById('connection-status');
                if (statusEl) statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Sign In Required';
                return;
            }
                const broadcastsRef = db.ref('broadcasts');
                broadcastsRef.on('value', (snapshot) => {
                    document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live';
                    const remoteData = filterBroadcastsForCurrentAccount(snapshot.val() || {});
                const savedLocal = readSavedDrivers();
const merged = remoteData;
                window.fleetData = window.fleetData = fleetData = merged;
                writeSavedDrivers(fleetData);
                    renderFleetRosterAndMarkers();
                }, (error) => {
                    document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Disconnected'; console.error('RTDB read error:', error);
                });
            });
        }

        function createTruckElement(accentColor) {
            const el = document.createElement('div');
            el.className = 'pro-vehicle-marker';
            el.style.width = '40px';
            el.style.height = '40px';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.filter = 'drop-shadow(0px 6px 12px rgba(0,0,0,0.6))';
            el.innerHTML = `
                <svg viewBox="0 0 24 36" width="32" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1.5" y="9" width="3.5" height="7" rx="1" fill="#090d16" stroke="${accentColor}" stroke-width="1"/>
                    <rect x="19" y="9" width="3.5" height="7" rx="1" fill="#090d16" stroke="${accentColor}" stroke-width="1"/>

<script id="smd-fleet-map-controls-v1">
(function() {
  window.fleetIs3D = false;
  let selectedFleetSid = null;

  function getMap() {
    return (typeof map !== 'undefined' && map) ? map : window.map;
  }

  function getFleet() {
    return (typeof fleetData !== 'undefined' && fleetData) ? fleetData : (window.fleetData || {});
  }

  function isValidCoord(lat, lng) {
    if (!isFinite(lat) || !isFinite(lng)) return false;
    if (Math.abs(lat) < 0.001 && Math.abs(lng) < 0.001) return false;
    if (lat < -85 || lat > 85 || lng < -180 || lng > 180) return false;
    return true;
  }

  function getValidEntries() {
    const store = getFleet();
    const out = [];
    Object.keys(store || {}).forEach((sid) => {
      const d = store[sid];
      if (!d) return;
      const lat = parseFloat(d.lat), lng = parseFloat(d.lng);
      const dLat = parseFloat(d.destLat), dLng = parseFloat(d.destLng);
      const hasDriver = isValidCoord(lat, lng);
      const hasDest = isValidCoord(dLat, dLng);
      if (hasDriver || hasDest) {
        out.push({
          sid,
          driver: d,
          lat: hasDriver ? lat : null,
          lng: hasDriver ? lng : null,
          destLat: hasDest ? dLat : null,
          destLng: hasDest ? dLng : null
        });
      }
    });
    return out;
  }

  const prevSelect = window.selectDriver;
  window.selectDriver = function(sid) {
    selectedFleetSid = sid;
    if (typeof prevSelect === 'function') prevSelect.apply(this, arguments);
    const m = getMap();
    const hit = getValidEntries().find(e => e.sid === sid);
    if (hit && m && typeof m.easeTo === 'function') {
      const targetLng = hit.lng !== null ? hit.lng : hit.destLng;
      const targetLat = hit.lat !== null ? hit.lat : hit.destLat;
      m.easeTo({ center: [targetLng, targetLat], zoom: 15.8, bearing: 0, pitch: window.fleetIs3D ? 45 : 0, duration: 550 });
    }
  };

  window.recenterFleetMap = function() {
    const m = getMap();
    if (!m || typeof m.easeTo !== 'function') return;
    const entries = getValidEntries();
    const hit = (selectedFleetSid && entries.find(e => e.sid === selectedFleetSid)) || entries[0];
    if (hit) {
      const targetLng = hit.lng !== null ? hit.lng : hit.destLng;
      const targetLat = hit.lat !== null ? hit.lat : hit.destLat;
      m.easeTo({ center: [targetLng, targetLat], zoom: 15.8, bearing: 0, pitch: window.fleetIs3D ? 45 : 0, duration: 500 });
    } else if (typeof m.getCenter === 'function') {
      const c = m.getCenter();
      m.easeTo({ center: [c.lng, c.lat], zoom: 14, bearing: 0, pitch: window.fleetIs3D ? 45 : 0, duration: 450 });
    }
  };

  window.fitBothFleetAndDest = function() {
    const m = getMap();
    if (!m || typeof mapboxgl === 'undefined') return;
    const entries = getValidEntries();
    const focus = (selectedFleetSid && entries.filter(e => e.sid === selectedFleetSid).length)
      ? entries.filter(e => e.sid === selectedFleetSid)
      : entries;
    const bounds = new mapboxgl.LngLatBounds();
    let pts = 0;
    focus.forEach((e) => {
      if (e.lng !== null && e.lat !== null) { bounds.extend([e.lng, e.lat]); pts++; }
      if (e.destLng !== null && e.destLat !== null) { bounds.extend([e.destLng, e.destLat]); pts++; }
    });
    if (pts >= 2 && typeof m.fitBounds === 'function') {
      m.fitBounds(bounds, { padding: { top: 65, bottom: 75, left: 55, right: 55 }, maxZoom: 15.5, bearing: 0, pitch: 0, duration: 550 });
    } else if (pts === 1) {
      window.recenterFleetMap();
    } else {
      window.resetFleetView();
    }
  };

  window.resetFleetView = function() {
    const m = getMap();
    if (!m || typeof mapboxgl === 'undefined') return;
    const entries = getValidEntries();
    const bounds = new mapboxgl.LngLatBounds();
    let pts = 0;
    entries.forEach((e) => {
      if (e.lng !== null && e.lat !== null) { bounds.extend([e.lng, e.lat]); pts++; }
    });
    if (pts >= 2 && typeof m.fitBounds === 'function') {
      m.fitBounds(bounds, { padding: { top: 65, bottom: 75, left: 55, right: 55 }, maxZoom: 14.8, bearing: 0, pitch: window.fleetIs3D ? 45 : 0, duration: 550 });
    } else if (pts === 1) {
      window.recenterFleetMap();
    } else if (typeof m.flyTo === 'function') {
      m.flyTo({ center: [-95.2831, 29.9731], zoom: 12, bearing: 0, pitch: window.fleetIs3D ? 45 : 0, essential: true, duration: 700 });
    }
  };

  function applyFleet3DLayer(m) {
    if (!m || typeof m.getLayer !== 'function') return;
    try {
      if (m.getLayer('smd-fleet-3d-buildings')) return;
      const style = m.getStyle && m.getStyle();
      const layers = (style && style.layers) || [];
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }
      if (!m.getSource('composite')) return;
      m.addLayer({
        id: 'smd-fleet-3d-buildings',
        source: 'composite',
        'source-layer': 'building',
        filter: ['==', 'extrude', 'true'],
        type: 'fill-extrusion',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': '#cbd5e1',
          'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, ['get', 'height']],
          'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, ['get', 'min_height']],
          'fill-extrusion-opacity': 0.72
        }
      }, labelLayerId);
    } catch (e) {}
  }

  window.toggleFleet3D = function() {
    const m = getMap();
    if (!m || typeof m.easeTo !== 'function') return;
    window.fleetIs3D = !window.fleetIs3D;
    const btn = document.getElementById('fleet-3d-btn');
    if (btn) btn.textContent = window.fleetIs3D ? '3D: ON' : '3D: OFF';
    if (window.fleetIs3D) {
      applyFleet3DLayer(m);
      m.easeTo({ pitch: 45, duration: 450 });
    } else {
      m.easeTo({ pitch: 0, bearing: 0, duration: 450 });
    }
  };

  let lastTouch = 0;
  function bindFleetBtn(id, fn) {
    const el = document.getElementById(id);
    if (!el || el.dataset.smdFleetBound === '2') return;
    el.dataset.smdFleetBound = '2';
    el.style.touchAction = 'manipulation';
    el.style.pointerEvents = 'auto';
    el.style.zIndex = '30';
    el.removeAttribute('onclick');
    el.onclick = null;
    const fire = (e) => {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      const now = Date.now();
      if (now - lastTouch < 250) return;
      lastTouch = now;
      fn();
    };
    el.addEventListener('click', fire, true);
    el.addEventListener('pointerup', fire, true);
  }

  function wireAllFleetBtns() {
    bindFleetBtn('fleet-recenter-btn', window.recenterFleetMap);
    bindFleetBtn('fleet-fit-both-btn', window.fitBothFleetAndDest);
    bindFleetBtn('fleet-overview-btn', window.resetFleetView);
    bindFleetBtn('fleet-3d-btn', window.toggleFleet3D);
    document.querySelectorAll('button[onclick="resetFleetView()"]').forEach((btn) => {
      if (btn.id === 'fleet-overview-btn' || btn.dataset.smdFleetBound === '2') return;
      btn.dataset.smdFleetBound = '2';
      btn.removeAttribute('onclick');
      btn.addEventListener('click', (e) => { e.preventDefault(); window.resetFleetView(); }, true);
    });
    const m = getMap();
    if (m && typeof m.on === 'function' && !m._smdFleet3dHooked) {
      m._smdFleet3dHooked = true;
      m.on('style.load', () => {
        if (window.fleetIs3D) applyFleet3DLayer(m);
      });
    }
  }

  wireAllFleetBtns();
  setInterval(wireAllFleetBtns, 1000);
  document.addEventListener('DOMContentLoaded', wireAllFleetBtns);
  window.addEventListener('load', wireAllFleetBtns);
})();
</script>

      if (typeof renderFleetRosterAndMarkers === 'function') renderFleetRosterAndMarkers();
      if (typeof attachBroadcastsListener === 'function' && scope !== 'signed_out') attachBroadcastsListener();
