<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeeMyDriver - Fleet Command</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mapbox GL JS CSS & JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-sans selection:bg-amber-400 selection:text-black antialiased">

    <!-- HEADER / NAVBAR -->
    <header class="w-full border-b border-neutral-900 bg-black/80 backdrop-blur-md sticky top-0 z-50 px-3 sm:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(251,191,36,0.5)] shrink-0">
                <span class="text-black font-black text-xl">🚀</span>
            </div>
            <div>
                <span class="font-black tracking-tight text-2xl text-white">Fleet<span class="text-amber-400">Command</span></span>
                <span id="connection-status" class="block text-[10px] text-emerald-400 font-mono">● System Online</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="/" class="text-xs font-bold text-neutral-300 hover:text-white bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-xl transition cursor-pointer">← Back to Solo</a>
        </div>
    </header>

    <!-- MAIN FLEET DASHBOARD CONTAINER -->
    <main class="flex-1 flex flex-col p-4 sm:p-6 w-full max-w-7xl mx-auto gap-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-[#12141c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-1">
                <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Active Vehicles</span>
                <span id="fleet-active-count" class="text-2xl font-black text-amber-400">0</span>
            </div>
            <div class="bg-[#12141c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-1">
                <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Total Distance Today</span>
                <span id="fleet-total-dist" class="text-2xl font-black text-white">0.0 mi</span>
            </div>
            <div class="bg-[#12141c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-1">
                <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Dispatch Status</span>
                <span class="text-2xl font-black text-emerald-400">Ready</span>
            </div>
            <div class="bg-[#12141c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-1">
                <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Command Tier</span>
                <span class="text-2xl font-black text-blue-400">Enterprise</span>
            </div>
        </div>

        <!-- FLEET MAP & FEED CONTAINER -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">
            <div class="lg:col-span-2 h-[500px] lg:h-auto bg-neutral-900 border border-neutral-800 rounded-3xl relative overflow-hidden shadow-2xl">
                <div id="fleet-map" class="w-full h-full"></div>
            </div>
            <div class="bg-[#12141c] border border-neutral-800 rounded-3xl p-5 flex flex-col gap-4 shadow-xl">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-neutral-800 pb-3">Active Unit List</h3>
                <div id="fleet-unit-list" class="flex flex-col gap-3 overflow-y-auto max-h-[400px]">
                    <p class="text-xs text-neutral-500 text-center py-8">Waiting for driver telemetry feed...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full border-t border-neutral-900 py-6 text-center text-xs text-neutral-500">
        <div>© 2026 SeeMyDriver Fleet Command. Multi-Vehicle Dispatch Telemetry.</div>
    </footer>

</body>
</html>
