<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeeMyDriver Fleet | 3D Command Center</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { amber: { 400: '#fbbf24', 500: '#f59e0b' } }
                }
            }
        }
    </script>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <style>
        .mapboxgl-popup-content { background: #12141c !important; color: #fff !important; border-radius: 12px; border: 1px solid #262626; padding: 14px !important; }
        .pro-vehicle-marker { background: transparent !important; border: none !important; cursor: pointer; }
        .mapboxgl-ctrl-group { background: #12141c !important; border: 1px solid #262626 !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important; }
        .mapboxgl-ctrl-group button { border-bottom: 1px solid #262626 !important; }
        .mapboxgl-ctrl-group button:last-child { border-bottom: none !important; }
        .mapboxgl-ctrl-icon { filter: invert(100%) hue-rotate(180deg) brightness(1.2); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col font-sans selection:bg-amber-400 selection:text-black antialiased">

    <header class="w-full border-b border-neutral-900 bg-black/90 backdrop-blur-md z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-4 cursor-pointer">
            <div class="w-14 h-14 bg-amber-400 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(251,191,36,0.4)] shrink-0 overflow-hidden">
                <span class="text-black font-black text-2xl">👀</span>
            </div>
            <div class="flex flex-col">
                <span class="font-black tracking-tight text-2xl sm:text-3xl text-white">See<span class="text-amber-400">MyDriver</span></span>
                <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20 font-mono w-fit mt-0.5">3D FLEET COMMAND</span>
            </div>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <span id="connection-status" class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20 hidden sm:flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live
            </span>
        </div>
    </header>

    <!-- BULLETPROOF LAYOUT WRAPPER -->
    <div class="flex-1 relative flex flex-col md:flex-row w-full overflow-hidden" style="height: calc(100vh - 65px);">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-[420px] bg-[#0f1117] border-r border-neutral-900 flex flex-col z-20 shrink-0 h-[45vh] md:h-full overflow-y-auto">
            <div class="p-4 border-b border-neutral-900 flex flex-col gap-3 bg-black/40 shrink-0">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black uppercase tracking-wider text-neutral-400">Active Fleet Roster</span>
                    <span id="driver-count" class="text-xs bg-neutral-900 text-amber-400 px-3 py-1 rounded-full font-mono border border-neutral-800">0 Active</span>
                </div>
                <div class="relative">
                    <input type="text" id="fleet-search" oninput="filterRoster()" placeholder="Search drivers or destinations..." class="w-full bg-neutral-900/90 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-amber-400/50 font-mono transition-all">
                </div>
            </div>

            <div class="p-4 border-b border-neutral-900 bg-[#12141c]/60 flex flex-col gap-2.5 font-mono text-xs shrink-0">
                <div class="font-black text-white text-xs flex items-center gap-2 mb-1">🚀 NEW JOB DISPATCH CONTROL</div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">DRIVER NAME *</label>
                        <input type="text" id="job-driver-name" placeholder="e.g. Marcus" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">DRIVER PHONE</label>
                        <input type="tel" id="job-driver-phone" placeholder="8329025417" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">CUSTOMER NAME</label>
                        <input type="text" id="job-cust-name" placeholder="John Smith" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="text-neutral-400 block mb-1 text-[10px]">CUSTOMER PHONE</label>
                        <input type="tel" id="job-cust-phone" placeholder="555-0142" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div class="relative">
                    <label class="text-neutral-400 block mb-1 text-[10px]">DESTINATION ADDRESS *</label>
                    <input type="text" id="job-cust-address" oninput="window.handleAddressInput(this.value)" autocomplete="off" placeholder="Start typing address..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-amber-400">
                    <div id="address-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#161923] border border-neutral-800 rounded-xl shadow-2xl z-[99999] max-h-48 overflow-y-auto"></div>
                </div>

                <div class="flex gap-2 mt-1">
                    <button onclick="window.handleFleetDispatch(true)" class="flex-1 bg-neutral-800 hover:bg-neutral-700 text-amber-400 font-black text-xs py-2.5 rounded-xl border border-neutral-700 transition-all cursor-pointer">📱 Text & Deploy</button>
                    <button onclick="window.handleFleetDispatch(false)" class="flex-1 bg-amber-400 hover:bg-amber-500 text-black font-black text-xs py-2.5 rounded-xl transition-all shadow-md cursor-pointer">Deploy Only 🚀</button>
                </div>
            </div>

            <div id="driver-list" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[120px]">
                <div class="text-xs text-neutral-500 text-center py-8 font-mono">Listening for active broadcasts...</div>
            </div>

            <div class="p-4 border-t border-neutral-900 bg-black/40 flex flex-col gap-2 shrink-0">
                <button onclick="resetFleetView()" class="w-full bg-neutral-900 hover:bg-neutral-800 text-neutral-300 hover:text-white text-xs font-bold py-2.5 rounded-xl border border-neutral-800 transition-all flex items-center justify-center gap-2 cursor-pointer shadow-inner">
                    <span>↺ Reset to Fleet Overview</span>
                </button>
                <button onclick="purgeAllBroadcasts()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 text-xs font-bold py-2 rounded-xl border border-red-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <span>🗑️ Purge All Broadcast Sessions</span>
                </button>
            </div>
        </aside>

        <!-- MAP CONTAINER -->
        <main class="flex-1 relative bg-neutral-950 h-[55vh] md:h-full w-full z-10">
            <div id="map" class="absolute inset-0 w-full h-full z-0"></div>
            
            <!-- Custom Fleet Map Action Overlay -->
            <div class="absolute bottom-4 left-4 right-4 z-30 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
                <div class="bg-black/90 backdrop-blur-md border border-amber-400/50 text-amber-400 text-xs font-bold px-3.5 py-2 rounded-xl pointer-events-auto shadow-xl cursor-pointer hover:bg-neutral-900 transition" onclick="window.toggleFleet3D()">
                    🌐 <span id="fleet-3d-label">3D Tilt: ON</span>
                </div>
                <div class="flex items-center gap-2 pointer-events-auto">
                    <button onclick="window.fitFleetBounds()" class="bg-black/90 hover:bg-neutral-900 border border-neutral-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xl transition cursor-pointer">Fit All Drivers</button>
                    <button onclick="window.resetFleetView()" class="bg-amber-400 hover:bg-amber-300 text-black text-xs font-black px-4 py-2 rounded-xl shadow-xl transition cursor-pointer">Reset View</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAfT3ZCE8DEmjsf4FLIqDgdYIQL1woIJOI",
            authDomain: "seemydriver-prod.firebaseapp.com",
            databaseURL: "https://seemydriver-prod-default-rtdb.firebaseio.com",
            projectId: "seemydriver-prod",
            storageBucket: "seemydriver-prod.firebasestorage.app",
            messagingSenderId: "16366013329",
            appId: "1:16366013329:web:7e993e6ee37f940a04a064"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const FULL_MAPBOX_TOKEN = 'pk.eyJ1Ijoic29ubnlqb25lczIwMTQiLCJhIjoiY212NHExMmxjMTBmODJ3cHh5cmcxbmZyZSJ9.wq8EANp8vooYz3gE2o4Krg';
        mapboxgl.accessToken = FULL_MAPBOX_TOKEN;

        let map;
        let activeMarkers = {}; 
        let cachedDestLat = null;
        let cachedDestLng = null;
        let geocodeTimer = null;
        let is3DMode = true;

        const $ = (id) => document.getElementById(id);

        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: {
                    version: 8,
                    sources: { 'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
                    layers: [{ id: 'osm-raster', type: 'raster', source: 'osm' }]
                },
                center: [-95.2831, 29.9731],
                zoom: 13,
                pitch: 55,
                bearing: -17,
                antialias: true
            });
            map.addControl(new mapboxgl.NavigationControl(), 'top-right');
            
            map.on('load', () => {
                map.resize();
                firebase.auth().signInAnonymously().then(() => {
                    initFirebaseListeners();
                }).catch(err => {
                    initFirebaseListeners();
                });
            });

            window.addEventListener('resize', () => {
                if (map) map.resize();
            });
        }

        window.toggleFleet3D = function() {
            if (!map) return;
            is3DMode = !is3DMode;
            map.easeTo({
                pitch: is3DMode ? 55 : 0,
                bearing: is3DMode ? -17 : 0,
                duration: 1000
            });
            const lbl = document.getElementById('fleet-3d-label');
            if (lbl) lbl.textContent = is3DMode ? '3D Tilt: ON' : '2D View: ON';
        };

        window.fitFleetBounds = function() {
            if (!map) return;
            const sessionIds = Object.keys(activeMarkers);
            if (sessionIds.length === 0) {
                window.resetFleetView();
                return;
            }
            const bounds = new mapboxgl.LngLatBounds();
            sessionIds.forEach(id => {
                const pos = activeMarkers[id].marker.getLngLat();
                bounds.extend([pos.lng, pos.lat]);
            });
            map.fitBounds(bounds, { padding: 80, maxZoom: 17, duration: 1000 });
        };

        window.handleAddressInput = async function(value) {
            const suggestions = document.getElementById('address-suggestions');
            if (!suggestions) return;

            clearTimeout(geocodeTimer);
            const query = (value || '').trim();
            
            if (query.length < 3) {
                suggestions.classList.add('hidden');
                suggestions.style.display = 'none';
                suggestions.innerHTML = '';
                return;
            }

            geocodeTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${FULL_MAPBOX_TOKEN}&autocomplete=true&types=address,poi&limit=5`);
                    const data = await res.json();
                    suggestions.innerHTML = '';

                    if (!data.features || data.features.length === 0) {
                        suggestions.classList.add('hidden');
                        suggestions.style.display = 'none';
                        return;
                    }

                    data.features.forEach(f => {
                        const name = f.place_name || f.text || '';
                        const coords = f.center || (f.geometry && f.geometry.coordinates) || [0, 0];

                        const div = document.createElement('div');
                        div.className = "px-3 py-2.5 text-xs text-neutral-200 hover:bg-neutral-800 hover:text-amber-400 cursor-pointer border-b border-neutral-800/80 transition font-medium";
                        div.innerText = name;
                        div.onpointerdown = (e) => {
                            e.preventDefault();
                            const inputField = document.getElementById('job-cust-address');
                            if (inputField) inputField.value = name;
                            
                            cachedDestLat = coords[1];
                            cachedDestLng = coords[0];
                            
                            suggestions.classList.add('hidden');
                            suggestions.style.display = 'none';
                        };
                        suggestions.appendChild(div);
                    });

                    suggestions.classList.remove('hidden');
                    suggestions.style.display = 'block';
                } catch (e) {
                    console.error('Fleet geocoder lookup error:', e);
                }
            }, 300);
        };

        let fleetData = {};
        try {
            const cachedRoster = localStorage.getItem('smd_persistent_fleet_roster');
            if (cachedRoster) {
                fleetData = JSON.parse(cachedRoster);
            }
        } catch(e) {}

        function initFirebaseListeners() {
            db.ref('.info/connected').on('value', (snap) => {
                const connected = snap.val();
                const statusEl = document.getElementById('connection-status');
                if (statusEl) {
                    if (connected) {
                        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live';
                        statusEl.className = "text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20 hidden sm:flex items-center gap-1.5";
                    } else {
                        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Disconnected';
                        statusEl.className = "text-xs font-mono text-red-400 bg-red-500/10 px-3 py-1.5 rounded-xl border border-red-500/20 hidden sm:flex items-center gap-1.5";
                    }
                }
            });

            const authUser = firebase.auth().currentUser;
            const compUuid = authUser ? authUser.uid : 'default_fleet_owner';
            const broadcastsRef = db.ref(`companies/${compUuid}/broadcasts`);
            
            broadcastsRef.on('value', (snapshot) => {
                const val = snapshot.val();
                if (val && typeof val === 'object' && Object.keys(val).length > 0) {
                    fleetData = { ...fleetData, ...(window.localFleetCache || {}), ...val };
                } else if (!val) {
                    const saved = localStorage.getItem('smd_persistent_fleet_roster');
                    if (saved) {
                        try { fleetData = JSON.parse(saved); } catch(e) {}
                    }
                }
                try {
                    localStorage.setItem('smd_persistent_fleet_roster', JSON.stringify(fleetData));
                } catch(e) {}
                renderFleetRosterAndMarkers();
            }, (error) => {
                console.error("Firebase sync error:", error);
            });
        }

        function createTruckElement(accentColor, heading = 0) {
            const el = document.createElement('div');
            el.className = 'pro-vehicle-marker';
            el.innerHTML = `
                <div style="transform: rotate(${heading}deg) rotateX(25deg); transform-origin: 50% 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 14px 16px rgba(0,0,0,0.9)); perspective: 600px;">
                    <svg viewBox="0 0 24 36" width="36" height="54" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: translateZ(10px);">
                        <rect x="1" y="8" width="4" height="8" rx="1.5" fill="#030712" stroke="${accentColor}" stroke-width="0.75"/>
                        <rect x="19" y="8" width="4" height="8" rx="1.5" fill="#030712" stroke="${accentColor}" stroke-width="0.75"/>
                        <rect x="1" y="24" width="4" height="8" rx="1.5" fill="#030712" stroke="${accentColor}" stroke-width="0.75"/>
                        <rect x="19" y="24" width="4" height="8" rx="1.5" fill="#030712" stroke="${accentColor}" stroke-width="0.75"/>
                        <rect x="3.5" y="11" width="17" height="22" rx="3" fill="url(#truckBodyGrad)" stroke="${accentColor}" stroke-width="1.25"/>
                        <rect x="3.5" y="20" width="17" height="4" fill="#f59e0b"/>
                        <line x1="3.5" y1="22" x2="20.5" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
                        <path d="M5.5 11H18.5V5C18.5 3.34315 17.1569 2 15.5 2H8.5C6.84315 2 5.5 3.34315 5.5 5V11Z" fill="#111827" stroke="#374151" stroke-width="1.25"/>
                        <path d="M7 7.5H17L16 4H8L7 7.5Z" fill="#38bdf8" fill-opacity="0.95" stroke="#bae6fd" stroke-width="0.75"/>
                        <circle cx="6.5" cy="3" r="1.25" fill="#fbbf24"/>
                        <circle cx="17.5" cy="3" r="1.25" fill="#fbbf24"/>
                    </svg>
                    <svg width="0" height="0"><defs><linearGradient id="truckBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#0b0f19"/></linearGradient></defs></svg>
                </div>
            `;
            return el;
        }

        window.renderFleetRosterAndMarkers = function() {
            const listContainer = document.getElementById('driver-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            const sessionIds = Object.keys(fleetData);
            const searchTerm = (document.getElementById('fleet-search').value || '').toLowerCase();

            const activeSessions = sessionIds.filter(id => {
                const d = fleetData[id];
                if (!d || d.ended) return false;
                const lat = Number(d.lat || d.destLat);
                const lng = Number(d.lng || d.destLng);
                if (!isFinite(lat) || !isFinite(lng)) return false;
                if (searchTerm) {
                    const name = (d.driverName || '').toLowerCase();
                    const addr = (d.destAddress || '').toLowerCase();
                    return name.includes(searchTerm) || addr.includes(searchTerm);
                }
                return true;
            });

            document.getElementById('driver-count').innerText = `${activeSessions.length} Active`;

            if (activeSessions.length === 0) {
                listContainer.innerHTML = '<div class="text-xs text-neutral-500 text-center py-8 font-mono">No active broadcasts found. Deploy a job above!</div>';
                Object.keys(activeMarkers).forEach(id => { activeMarkers[id].marker.remove(); delete activeMarkers[id]; });
                return;
            }

            const currentMarkerIds = new Set(activeSessions);
            Object.keys(activeMarkers).forEach(id => {
                if (!currentMarkerIds.has(id)) { activeMarkers[id].marker.remove(); delete activeMarkers[id]; }
            });

            activeSessions.forEach((sid, index) => {
                const driver = fleetData[sid];
                const accentColors = ['#fbbf24', '#3b82f6', '#10b981', '#f43f5e', '#a855f7'];
                const color = accentColors[index % accentColors.length];
                const lat = Number(driver.lat || driver.destLat);
                const lng = Number(driver.lng || driver.destLng);
                const driverName = driver.driverName || 'Active Driver';
                const address = driver.destAddress || 'Custom Destination';
                const speed = driver.speed || 0;
                const heading = Number(driver.heading) || 0;

                const card = document.createElement('div');
                card.className = `bg-[#12141c] hover:bg-[#161923] border border-neutral-800 p-4 rounded-2xl cursor-pointer transition-all shadow-lg flex flex-col gap-2`;
                card.style.borderLeft = `4px solid ${color}`;
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-black text-white text-sm flex items-center gap-2" onclick="selectDriver('${sid}')">
                            <span class="w-2.5 h-2.5 rounded-full" style="background: ${color};"></span>
                            ${driverName}
                        </span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/20">En Route</span>
                            <button onclick="event.stopPropagation(); deleteDriverSession('${sid}')" title="Remove Session" class="group text-neutral-300 hover:text-red-400 p-2.5 rounded-xl transition-all bg-neutral-900 hover:bg-red-500/20 border border-neutral-800 cursor-pointer flex items-center justify-center">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>
                            </button>
                        </div>
                    </div>
                    <p class="text-xs text-neutral-400 font-medium truncate" onclick="selectDriver('${sid}')">Dest: ${address}</p>
                    <div class="flex items-center justify-between text-xs font-mono text-neutral-400 pt-1 border-t border-neutral-800/60" onclick="selectDriver('${sid}')">
                        <span>Speed: <strong style="color: ${color};">${speed} mph</strong></span>
                        <span>3D Live Telemetry</span>
                    </div>
                `;
                listContainer.appendChild(card);

                const lngLat = [lng, lat];
                const popupHtml = `<b style="color:${color}; font-size:14px;">${driverName}</b><br><span style="color:#a3a3a3">Speed: ${speed} mph</span><br>Dest: <b>${address}</b>`;

                if (activeMarkers[sid]) {
                    activeMarkers[sid].marker.setLngLat(lngLat);
                    activeMarkers[sid].marker.getPopup().setHTML(popupHtml);
                    const inner = activeMarkers[sid].marker.getElement().querySelector('div');
                    if (inner) {
                        inner.style.transform = `rotate(${heading}deg) rotateX(25deg)`;
                    }
                } else {
                    const el = createTruckElement(color, heading);
                    const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(popupHtml);
                    const marker = new mapboxgl.Marker(el).setLngLat(lngLat).setPopup(popup).addTo(map);
                    el.addEventListener('click', () => selectDriver(sid));
                    activeMarkers[sid] = { marker, driver };
                }
            });
        }

        function filterRoster() { renderFleetRosterAndMarkers(); }

        window.handleFleetDispatch = async function(isTextDeploy) {
            let authUser = firebase.auth().currentUser;
            if (!authUser) {
                try {
                    const cred = await firebase.auth().signInAnonymously();
                    authUser = cred.user;
                } catch (e) {
                    console.error("Anonymous auth failed:", e);
                }
            }
            const compUuid = authUser ? authUser.uid : null;
            if (!compUuid) {
                alert('Authentication required. Please wait a moment or sign in.');
                return;
            }

            const driverName = $('job-driver-name').value.trim();
            const driverPhone = $('job-driver-phone').value.trim().replace(/[^\d+]/g, '');
            const custName = $('job-cust-name').value.trim();
            const custPhone = $('job-cust-phone').value.trim();
            const address = $('job-cust-address').value.trim();

            if (!driverName || !address) {
                alert('Please enter a driver name and destination address.');
                return;
            }

            let lat = cachedDestLat || 29.9731;
            let lng = cachedDestLng || -95.2831;

            const buffer = new Uint8Array(8);
            window.crypto.getRandomValues(buffer);
            const sessionId = 'smd_' + Array.from(buffer, b => b.toString(16).padStart(2, '0')).join('');

            const payload = {
                ownerUid: compUuid,
                driverName: driverName,
                driverPhone: driverPhone,
                custName: custName,
                custPhone: custPhone,
                destAddress: address,
                destLat: lat,
                destLng: lng,
                lat: lat,
                lng: lng,
                speed: 0,
                heading: 0,
                timestamp: Date.now()
            };

            db.ref(`companies/${compUuid}/broadcasts/${sessionId}`).set(payload).then(() => {
                if (!isTextDeploy) alert('Job deployed successfully!');
            }).catch(err => {
                alert("Dispatch failed: " + err.message);
            });

            if (!window.localFleetCache) window.localFleetCache = {};
            window.localFleetCache[sessionId] = payload;
            fleetData[sessionId] = payload;
            
            try {
                localStorage.setItem('smd_persistent_fleet_roster', JSON.stringify(fleetData));
            } catch(e) {}

            renderFleetRosterAndMarkers();
            selectDriver(sessionId);

            const driverLink = `${window.location.origin}/fleet/driver-broadcast.html?comp=${compUuid}&session=${sessionId}&driver=${encodeURIComponent(driverName)}&dest=${encodeURIComponent(address)}&lat=${lat}&lng=${lng}&phone=${encodeURIComponent(custPhone)}`;

            if (isTextDeploy && driverPhone) {
                const smsUrl = `sms:${driverPhone}?body=` + encodeURIComponent(`SeeMyDriver Dispatch: Tap to start your route to ${address}: ${driverLink}`);
                window.open(smsUrl, '_blank');
            }

            $('job-driver-name').value = '';
            $('job-driver-phone').value = '';
            $('job-cust-name').value = '';
            $('job-cust-phone').value = '';
            $('job-cust-address').value = '';
            cachedDestLat = null;
            cachedDestLng = null;
        };

        window.deleteDriverSession = function(sid) {
            const authUser = window.firebase && window.firebase.auth ? window.firebase.auth().currentUser : null;
            const compUuid = authUser ? authUser.uid : 'default_fleet_owner';
            if (confirm(`Delete session ${sid}?`)) {
                db.ref(`companies/${compUuid}/broadcasts/${sid}`).remove().then(() => {
                    if (activeMarkers[sid]) { activeMarkers[sid].marker.remove(); delete activeMarkers[sid]; }
                    delete fleetData[sid];
                    if (window.localFleetCache) delete window.localFleetCache[sid];
                    try {
                        localStorage.setItem('smd_persistent_fleet_roster', JSON.stringify(fleetData));
                    } catch(e) {}
                    renderFleetRosterAndMarkers();
                });
            }
        };

        window.purgeAllBroadcasts = function() {
            const authUser = window.firebase && window.firebase.auth ? window.firebase.auth().currentUser : null;
            const compUuid = authUser ? authUser.uid : 'default_fleet_owner';
            if (confirm("⚠️ WARNING: Delete ALL company broadcast sessions?")) {
                db.ref(`companies/${compUuid}/broadcasts`).remove().then(() => {
                    Object.keys(activeMarkers).forEach(id => { activeMarkers[id].marker.remove(); });
                    activeMarkers = {}; fleetData = {}; window.localFleetCache = {};
                    try {
                        localStorage.removeItem('smd_persistent_fleet_roster');
                    } catch(e) {}
                    renderFleetRosterAndMarkers();
                });
            }
        };

        window.selectDriver = function(sid) {
            const data = activeMarkers[sid] || fleetData[sid];
            if (!data) return;
            const driver = data.driver || data;
            map.flyTo({ 
                center: [Number(driver.lng || driver.destLng), Number(driver.lat || driver.destLat)], 
                zoom: 16, 
                pitch: 55, 
                bearing: -17, 
                essential: true, 
                duration: 1200 
            });
            if (activeMarkers[sid] && activeMarkers[sid].marker) activeMarkers[sid].marker.togglePopup();
        };

        window.resetFleetView = function() { 
            map.flyTo({ center: [-95.2831, 29.9731], zoom: 12, pitch: 55, bearing: -17, essential: true, duration: 1000 }); 
        };
        
        if (document.readyState === 'complete') {
            initMap();
        } else {
            window.addEventListener('DOMContentLoaded', initMap);
        }
    </script>
</body>
</html>
