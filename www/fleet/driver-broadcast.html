<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeeMyDriver - Driver Broadcast Console</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- Embedded SafeStorage & Firebase Init -->
    <script>
        window.SafeStorage = {
            getItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem(key, val) { try { localStorage.setItem(key, val); } catch (e) {} },
            removeItem(key) { try { localStorage.removeItem(key); } catch (e) {} },
            clear() { try { localStorage.clear(); } catch (e) {} }
        };

        const firebaseConfig = { apiKey: "AIzaSyAfT3ZCE8DEmjsf4FLIqDgdYIQL1woIJOI", authDomain: "seemydriver-prod.firebaseapp.com", databaseURL: "https://seemydriver-prod-default-rtdb.firebaseio.com", projectId: "seemydriver-prod", storageBucket: "seemydriver-prod.firebasestorage.app", messagingSenderId: "16366013329", appId: "1:16366013329:web:7e993e6ee37f940a04a064" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        window.db = db;
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-sans antialiased">

    <!-- HEADER -->
    <header class="w-full border-b border-neutral-900 bg-black/80 backdrop-blur-md px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center font-black text-black">👀</div>
            <div class="flex flex-col">
                <span class="font-black text-lg text-white">Driver <span class="text-amber-400">Broadcast</span></span>
                <span id="driver-company-tag" class="text-[10px] font-mono text-neutral-400">Loading Fleet Tenant...</span>
            </div>
        </div>
        <div id="broadcast-status-badge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-3 py-1 rounded-full animate-pulse">
            ● Live Broadcast
        </div>
    </header>

    <!-- MAIN MAP & CONTROLS -->
    <main class="flex-1 flex flex-col p-4 max-w-4xl mx-auto w-full gap-4">
        
        <!-- Job Info Card -->
        <div class="bg-[#12141c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-2">
            <div class="flex justify-between items-center text-xs">
                <span class="text-neutral-400">Assigned Driver: <strong id="lbl-driver-name" class="text-white">--</strong></span>
                <span class="text-amber-400 font-mono" id="driver-map-speed">0 mph</span>
            </div>
            <div class="text-xs text-neutral-300">
                Destination: <strong id="lbl-dest-address" class="text-amber-300">--</strong>
            </div>
        </div>

        <!-- Map Container (Cloned from Solo Mode v68 Engine) -->
        <div class="w-full h-[400px] bg-neutral-900 border border-neutral-800 rounded-3xl relative overflow-hidden shadow-2xl">
            <div id="driver-map-container" class="w-full h-full"></div>
            
            <!-- GPS Badge -->
            <div class="smd-gps-badge absolute top-3 left-3 z-20 bg-black/85 border border-neutral-800 rounded-xl px-3 py-1 font-mono text-[11px] font-bold text-amber-400 backdrop-blur-md">
                GPS: searching… · v68
            </div>

            <!-- 3D Toggle -->
            <button type="button" id="driver-3d-btn" onclick="window.toggleDriver3D()" class="absolute top-3 right-3 z-20 bg-[#12141c] hover:bg-neutral-800 border border-neutral-800 text-amber-400 font-bold text-xs px-3 py-2 rounded-xl shadow cursor-pointer">
                🌐 3D: OFF
            </button>

            <!-- Map Controls -->
            <div class="absolute bottom-4 left-4 right-4 z-20 flex justify-between items-center">
                <div class="flex gap-2">
                    <button onclick="window.fitDriverMap()" class="bg-neutral-900/90 text-white text-xs font-bold px-3 py-2 rounded-xl border border-neutral-800">Fit Route</button>
                    <button onclick="window.recenterDriverMap()" class="bg-neutral-900/90 text-amber-400 text-xs font-bold px-3 py-2 rounded-xl border border-neutral-800">Recenter</button>
                </div>
                <button onclick="window.openDriverDirections()" class="bg-amber-400 text-black text-xs font-black px-4 py-2 rounded-xl">Directions</button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-3">
            <button onclick="window.textCustomerLink()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-black text-sm py-3.5 rounded-2xl transition shadow-lg cursor-pointer">
                💬 Text Live Tracking Link to Customer
            </button>
            <button onclick="window.copyCustomerLink()" class="w-full bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-white font-bold text-sm py-3.5 rounded-2xl transition cursor-pointer">
                📋 Copy Customer Tracking Link
            </button>
        </div>
    </main>

    <!-- Wire up the v68 Engine & Tenant Link Parser -->
    <script src="js/tracker.js?v=68"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const compUuid = params.get('comp') || 'default_fleet';
            const sessionId = params.get('session');
            const driverName = params.get('driver') || 'Driver';
            const destAddress = params.get('dest') || 'Destination';
            const destLat = parseFloat(params.get('lat')) || 29.7604;
            const destLng = parseFloat(params.get('lng')) || -95.3698;

            document.getElementById('driver-company-tag').textContent = `Tenant UUID: ${compUuid}`;
            document.getElementById('lbl-driver-name').textContent = driverName;
            document.getElementById('lbl-dest-address').textContent = destAddress;

            // Save state into SafeStorage for the v68 engine
            SafeStorage.setItem('smd_session_id', sessionId);
            SafeStorage.setItem('smd_active_broadcast', 'true');
            SafeStorage.setItem('smd_dest_lat', destLat);
            SafeStorage.setItem('smd_dest_lng', destLng);
            window.activeSessionId = sessionId;
            window.activeCompanyUuid = compUuid; // Multi-tenant namespace lock

            // Override Firebase target path to include company UUID namespace
            window.sendTenantFirebase = function(out) {
                const database = window.db;
                if (!out || !database || !sessionId) return;
                database.ref(`companies/${compUuid}/broadcasts/${sessionId}`).update({
                    lat: out.lat,
                    lng: out.lng,
                    speed: out.speedMph,
                    heading: out.heading,
                    driverName: driverName,
                    timestamp: Date.now()
                }).catch(err => console.error('Tenant sync error:', err));
            };

            // Hook up map and start v68 tracking
            if (typeof window.initDriverActiveMap === 'function') {
                window.initDriverActiveMap();
            }
            if (typeof window.startRealTimeTracking === 'function') {
                window.startRealTimeTracking();
            }
        });

        window.copyCustomerLink = async function() {
            const params = new URLSearchParams(window.location.search);
            const compUuid = params.get('comp') || 'default_fleet';
            const sessionId = params.get('session');
            const u = `${window.location.origin}/?view=customer&comp=${compUuid}&session=${sessionId}`;
            try { await navigator.clipboard.writeText(u); alert('Customer tracking link copied!'); } catch(e) {}
        };

        window.textCustomerLink = function() {
            const params = new URLSearchParams(window.location.search);
            const compUuid = params.get('comp') || 'default_fleet';
            const sessionId = params.get('session');
            const u = `${window.location.origin}/?view=customer&comp=${compUuid}&session=${sessionId}`;
            const clientPhone = params.get('phone') || '';
            window.open(`sms:${clientPhone}?body=` + encodeURIComponent(`Your tow truck is on the way! Track live here: ${u}`));
        };
    </script>
</body>
</html>
