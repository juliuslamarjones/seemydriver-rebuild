<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeMyDriver - Start Broadcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-6">

    <!-- Unified Header -->
    <header class="flex justify-between items-center max-w-lg w-full mx-auto mb-6">
        <div class="flex items-center gap-2">
            <span class="text-3xl">👀🚗</span>
            <h1 class="text-2xl font-black tracking-wider text-white">SeeMyDriver</h1>
        </div>
        <span class="text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">Broadcaster</span>
    </header>

    <!-- Main Form -->
    <main class="max-w-lg w-full mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col gap-5">
        <h2 class="text-lg font-semibold text-slate-200">Start New Live Job</h2>

        <div>
            <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Client Name</label>
            <input type="text" id="client-name" placeholder="e.g. Darren" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div>
            <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Driver Phone Number (for client call/text)</label>
            <input type="tel" id="driver-phone" placeholder="e.g. 2815551212" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div>
            <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Destination Address / Location</label>
            <input type="text" id="destination-input" placeholder="e.g. Empire State Building NY" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 transition">
        </div>

        <button id="start-btn" onclick="startBroadcast()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-900/20">
            Start Live Broadcast
        </button>

        <div id="status-msg" class="text-xs text-center text-slate-400 hidden">Broadcasting live telemetry... Keep this tab open!</div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 mt-6">
        © 2026 SeeMyDriver. Secure Cloud GPS Telemetry.
    </footer>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://seemydriver-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.startBroadcast = async function() {
            const clientName = document.getElementById('client-name').value.trim() || 'Client';
            const driverPhone = document.getElementById('driver-phone').value.trim();
            const destinationText = document.getElementById('destination-input').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!destinationText) {
                alert("Please enter a destination address.");
                return;
            }

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }

            statusMsg.classList.remove('hidden');
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "Acquiring GPS & Locating Address...";

            // 1. Get current position first to anchor/bias the geocoder search location
            const positionPromise = new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
            });

            let currentPos;
            try {
                currentPos = await positionPromise;
            } catch (err) {
                alert("Could not get your current GPS location to start broadcast.");
                statusMsg.classList.add('hidden');
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "Start Live Broadcast";
                return;
            }

            const lat = currentPos.coords.latitude;
            const lng = currentPos.coords.longitude;
            const speed = currentPos.coords.speed ? currentPos.coords.speed * 2.23694 : 0;

            // 2. Geocode using Photon with lat/lon location bias
            let destLat = null;
            let destLng = null;
            try {
                const geoUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(destinationText)}&lat=${lat}&lon=${lng}&limit=1`;
                const response = await fetch(geoUrl);
                const data = await response.json();
                
                if (data && data.features && data.features.length > 0) {
                    const coords = data.features[0].geometry.coordinates;
                    destLng = coords[0];
                    destLat = coords[1];
                } else {
                    alert("Could not find that location. Try a more specific address.");
                    statusMsg.classList.add('hidden');
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('start-btn').innerText = "Start Live Broadcast";
                    return;
                }
            } catch (err) {
                console.error("Geocoding error:", err);
                alert("Geocoding service error. Check your connection.");
                statusMsg.classList.add('hidden');
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "Start Live Broadcast";
                return;
            }

            // 3. Session ID in localStorage
            let sessionId = localStorage.getItem('activeSessionId');
            if (!sessionId) {
                sessionId = 'drv_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
                localStorage.setItem('activeSessionId', sessionId);
            }

            document.getElementById('start-btn').innerText = "Broadcasting Live...";

            // 4. Push initial state, then start continuous watcher
            const sessionRef = ref(db, 'sessions/' + sessionId);
            await update(sessionRef, {
                clientName: clientName,
                driverPhone: driverPhone,
                destination: destinationText,
                destLat: destLat,
                destLng: destLng,
                lat: lat,
                lng: lng,
                speed: speed,
                timestamp: Date.now()
            });

            // Start continuous watchPosition loop
            navigator.geolocation.watchPosition((pos) => {
                const curLat = pos.coords.latitude;
                const curLng = pos.coords.longitude;
                const curSpeed = pos.coords.speed ? pos.coords.speed * 2.23694 : 0;

                update(sessionRef, {
                    lat: curLat,
                    lng: curLng,
                    speed: curSpeed,
                    timestamp: Date.now()
                }).catch((error) => {
                    console.error("Firebase update error:", error);
                });
            }, (error) => {
                console.error("GPS watch error:", error);
            }, { 
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000 
            });

            setTimeout(() => {
                window.location.href = `app.html?session=${sessionId}`;
            }, 1000);
        };
    </script>
</body>
</html>
