<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeMyDriver - Live Tracking</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 35vh; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-4">

    <!-- Unified Header -->
    <header class="flex justify-between items-center mb-3 max-w-2xl w-full mx-auto">
        <div class="flex items-center gap-2">
            <span class="text-3xl">👀🚗</span>
            <h1 class="text-2xl font-black tracking-wider text-white">SeeMyDriver</h1>
        </div>
        <a href="/" class="bg-slate-800 text-xs px-3.5 py-2 rounded-lg font-medium hover:bg-slate-700 transition">Home</a>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-2xl w-full mx-auto flex flex-col gap-3">
        
        <!-- ETA & Distance Card -->
        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl shadow-lg grid grid-cols-2 gap-4">
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-500">Estimated Arrival</span>
                <div id="eta-display" class="text-xl font-black text-white mt-0.5">Calculating...</div>
            </div>
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Distance</span>
                <div id="distance-display" class="text-xl font-black text-white mt-0.5">-- mi</div>
            </div>
        </div>

        <!-- Direct Contact Buttons (Call & Message Driver - Positioned high so they are always visible) -->
        <div class="grid grid-cols-2 gap-3">
            <a id="call-btn" href="tel:#" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20">
                📞 Call Driver
            </a>
            <a id="msg-btn" href="sms:#" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20">
                💬 Message Driver
            </a>
        </div>

        <!-- Map Container -->
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-xl">
            <div id="map"></div>
            <div class="flex justify-between items-center mt-2 px-1">
                <div id="speed-display" class="bg-black/50 px-2.5 py-1 rounded-lg text-xs font-semibold text-emerald-400">Speed: 0 mph</div>
                <div class="flex gap-2">
                    <button onclick="fitBoth()" class="bg-slate-800 text-xs px-2.5 py-1.5 rounded-lg font-medium hover:bg-slate-700">Fit Both</button>
                    <button onclick="recenter()" class="bg-slate-800 text-xs px-2.5 py-1.5 rounded-lg font-medium hover:bg-slate-700">Recenter</button>
                </div>
            </div>
        </div>

        <!-- Driver & Destination Info -->
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-lg grid grid-cols-2 gap-3">
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Driver</span>
                <div id="driver-name-display" class="text-xs font-semibold text-white mt-0.5 truncate">Driver</div>
            </div>
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Destination</span>
                <div id="destination-display" class="text-xs font-semibold text-white mt-0.5 truncate">Waiting...</div>
            </div>
        </div>

        <!-- Secondary Action Buttons -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="copyLink()" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1.5">
                📋 Copy Link
            </button>
            <button onclick="textSMS()" class="bg-emerald-600 hover:bg-emerald-500 p-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1.5 text-slate-950 font-bold">
                📤 Share via SMS
            </button>
        </div>

        <button onclick="endBroadcast()" class="w-full bg-slate-900 border border-red-900/50 hover:bg-red-950/30 text-red-400 py-2.5 rounded-xl font-medium text-xs transition">
            ← End Broadcast & New Job
        </button>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 mt-2">
        © 2026 SeeMyDriver. Secure Cloud GPS Telemetry.
    </footer>

    <!-- Leaflet JS & Firebase SDK Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://seemydriver-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session') || localStorage.getItem('activeSessionId');

        const map = L.map('map').setView([29.9736, -95.2621], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}@{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© Leaflet'
        }).addTo(map);

        let truckMarker = null;
        let destMarker = null;
        let routePolyline = null;

        const flagIcon = L.divIcon({
            html: '<div style="font-size: 26px; line-height: 26px; text-align: center; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));">🏁</div>',
            className: 'custom-destination-flag',
            iconSize: [30, 30],
            iconAnchor: [15, 30]
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        if (sessionId) {
            const sessionRef = ref(db, 'sessions/' + sessionId);
            onValue(sessionRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('driver-name-display').innerText = data.clientName ? `${data.clientName}'s Driver` : 'Driver';
                    document.getElementById('destination-display').innerText = data.destination || 'Destination Set';
                    document.getElementById('speed-display').innerText = `Speed: ${Math.round(data.speed || 0)} mph`;

                    if (data.driverPhone) {
                        document.getElementById('call-btn').href = `tel:${data.driverPhone}`;
                        document.getElementById('msg-btn').href = `sms:${data.driverPhone}`;
                    } else {
                        document.getElementById('call-btn').onclick = (e) => { e.preventDefault(); alert("Driver phone number not provided."); };
                        document.getElementById('msg-btn').onclick = (e) => { e.preventDefault(); alert("Driver phone number not provided."); };
                    }

                    const currentLatLng = [data.lat, data.lng];
                    
                    if (!truckMarker) {
                        truckMarker = L.marker(currentLatLng).addTo(map).bindPopup("Driver Location");
                    } else {
                        truckMarker.setLatLng(currentLatLng);
                    }

                    if (data.destLat && data.destLng) {
                        const destLatLng = [data.destLat, data.destLng];

                        if (!destMarker) {
                            destMarker = L.marker(destLatLng, { icon: flagIcon }).addTo(map).bindPopup("Destination");
                        } else {
                            destMarker.setLatLng(destLatLng);
                        }

                        const latlngs = [currentLatLng, destLatLng];
                        if (!routePolyline) {
                            routePolyline = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.8 }).addTo(map);
                        } else {
                            routePolyline.setLatLngs(latlngs);
                        }

                        const distMiles = calculateDistance(data.lat, data.lng, data.destLat, data.destLng);
                        document.getElementById('distance-display').innerText = distMiles.toFixed(1) + ' mi';

                        const effectiveSpeed = (data.speed && data.speed > 5) ? data.speed : 45;
                        const hours = distMiles / effectiveSpeed;
                        const mins = Math.round(hours * 60);
                        document.getElementById('eta-display').innerText = mins + ' mins';
                    }
                }
            });
        }

        window.fitBoth = function() {
            if (truckMarker && destMarker) {
                const group = new L.featureGroup([truckMarker, destMarker]);
                map.fitBounds(group.getBounds().pad(0.15));
            } else if (truckMarker) {
                map.setView(truckMarker.getLatLng(), 15);
            }
        };

        window.recenter = function() {
            if (truckMarker) {
                map.setView(truckMarker.getLatLng(), 15);
            }
        };

        window.copyLink = function() {
            navigator.clipboard.writeText(window.location.href);
            alert("Tracking link copied to clipboard!");
        };

        window.textSMS = function() {
            const smsUrl = `sms:?body=${encodeURIComponent("Track my drive live here: " + window.location.href)}`;
            window.location.href = smsUrl;
        };

        window.endBroadcast = function() {
            localStorage.removeItem('activeSessionId');
            window.location.href = '/';
        };
    </script>
</body>
</html>
