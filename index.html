<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeMyDriver - Solo & Fleet Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col font-sans antialiased">
    <!-- TOP HEADER -->
    <header class="w-full border-b border-neutral-900 bg-black/80 backdrop-blur-md px-4 py-3.5 flex items-center justify-between shrink-0 h-[65px] z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center font-black text-black text-xl shadow-[0_0_20px_rgba(251,191,36,0.3)]">👀</div>
            <div class="flex flex-col">
                <span class="font-black text-base text-white">SeeMy<span class="text-amber-400">Driver</span></span>
                <span id="view-title-label" class="text-[10px] font-mono text-neutral-400">Solo Broadcast Mode</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="firebase-status" class="hidden md:flex bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-3 py-1 rounded-full items-center gap-1.5 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Secure SDK Live
            </div>
            <button id="btn-toggle-view" onclick="window.toggleAppView()" class="bg-amber-400 hover:bg-amber-300 text-black font-black text-xs px-4 py-2 rounded-xl transition cursor-pointer shadow-lg">
                🚀 Switch to Fleet Command
            </button>
        </div>
    </header>

    <!-- VIEW 1: SOLO LANDING / BROADCAST CONFIG -->
    <div id="view-solo" class="flex-1 flex flex-col items-center justify-center p-4 overflow-y-auto bg-[#08090d]">
        <div class="w-full max-w-md bg-[#12141c] border border-neutral-800 rounded-3xl p-6 flex flex-col gap-4 shadow-2xl">
            <div class="text-center mb-1">
                <h1 class="text-lg font-black text-white">Driver Broadcast Sign-In</h1>
                <p class="text-xs text-neutral-400 mt-0.5">Start your solo live tracking session instantly.</p>
            </div>
            
            <div class="flex flex-col gap-3">
                <div>
                    <label class="text-[11px] text-neutral-400 font-medium block mb-1">Your Driver Name</label>
                    <input type="text" id="solo-driver-name" value="Sonny" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                </div>
                <div>
                    <label class="text-[11px] text-neutral-400 font-medium block mb-1">Your Phone Number</label>
                    <input type="text" id="solo-driver-phone" value="8329025417" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                </div>
                <div>
                    <label class="text-[11px] text-neutral-400 font-medium block mb-1">Destination Address</label>
                    <input type="text" id="solo-destination" value="3455 FM 1960 Rd West, Houston, TX" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                </div>
            </div>

            <button type="button" onclick="window.startSoloBroadcast()" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-black text-xs py-3.5 rounded-xl transition shadow-lg cursor-pointer flex items-center justify-center gap-2 mt-2">
                🟢 Go Live & Broadcast Location
            </button>
        </div>
    </div>

    <!-- VIEW 2: FLEET COMMAND CENTER (Hidden by default) -->
    <main id="view-fleet" class="flex-1 flex flex-col md:flex-row w-full h-[calc(100vh-65px)] overflow-hidden hidden">
        <aside class="w-full md:w-[420px] bg-[#0c0d12] border-r border-neutral-900 flex flex-col h-full shrink-0 overflow-y-visible p-4 gap-4 relative z-30">
            <div class="bg-[#12141c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-3 shadow-lg shrink-0 relative">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-mono font-bold tracking-wider text-amber-400 uppercase">⚡ New Job Dispatch Control</span>
                </div>
                
                <div class="flex flex-col gap-2.5">
                    <div>
                        <label class="text-[11px] text-neutral-400 font-medium block mb-1">Driver Name</label>
                        <input type="text" id="input-driver-name" value="Sonny" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                    </div>
                    <div>
                        <label class="text-[11px] text-neutral-400 font-medium block mb-1">Driver Phone Number</label>
                        <input type="text" id="input-driver-phone" value="8329025417" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                    </div>
                    <div>
                        <label class="text-[11px] text-neutral-400 font-medium block mb-1">Customer Name</label>
                        <input type="text" id="input-customer-name" value="Julius L Jones" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                    </div>
                    <div>
                        <label class="text-[11px] text-neutral-400 font-medium block mb-1">Customer Phone Number</label>
                        <input type="text" id="input-customer-phone" value="555-0142" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                    </div>
                    
                    <div class="relative">
                        <label class="text-[11px] text-neutral-400 font-medium block mb-1">Destination Address (Global Search)</label>
                        <input type="text" id="input-destination" value="3455 FM 1960 Rd West" autocomplete="off" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400 transition" />
                        <div id="geocoder-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-[#12141c] border border-neutral-700 rounded-xl overflow-hidden z-[999] shadow-2xl hidden max-h-52 overflow-y-auto"></div>
                    </div>
                </div>

                <div class="flex flex-col gap-2 mt-2">
                    <button type="button" onclick="window.handleDeployTruckOnly()" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-black text-xs py-3 rounded-xl transition shadow-lg cursor-pointer flex items-center justify-center gap-1.5">
                        🚀 Deploy Truck Only
                    </button>
                    <button type="button" onclick="window.handleDeployAndTextDriver()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg cursor-pointer flex items-center justify-center gap-1.5">
                        📲 Deploy Truck & Text Link to Driver
                    </button>
                </div>
            </div>

            <div class="flex flex-col gap-2.5 flex-1">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-mono font-bold tracking-wider text-neutral-400 uppercase">Active Fleet Roster</span>
                    <span id="active-count" class="bg-neutral-800 text-amber-400 font-mono text-[10px] font-bold px-2 py-0.5 rounded-full">0 Active</span>
                </div>
                <div id="fleet-roster-container" class="flex flex-col gap-2.5 overflow-y-auto max-h-[calc(100vh-420px)]"></div>
            </div>

            <div class="pt-2 border-t border-neutral-900 flex flex-col gap-2 shrink-0">
                <div class="flex gap-2">
                    <button id="btn-fit-all" class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-bold py-2.5 rounded-xl border border-neutral-800 transition cursor-pointer">Fit All</button>
                    <button id="btn-reset-view" class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-amber-400 text-xs font-bold py-2.5 rounded-xl border border-neutral-800 transition cursor-pointer">Reset View</button>
                </div>
                <button id="btn-purge-all" class="w-full bg-red-950/40 hover:bg-red-900/50 text-red-400 border border-red-900/50 text-xs font-bold py-2 rounded-xl transition cursor-pointer">
                    Purge All Broadcast Sessions
                </button>
            </div>
        </aside>

        <!-- MAP CONTAINER WITH EXPLICIT MOBILE HEIGHT -->
        <div class="w-full md:flex-1 h-[400px] md:h-full relative bg-neutral-950 flex flex-col min-w-0 order-first md:order-last">
            <div id="fleet-map-container" class="w-full h-full absolute inset-0"></div>
            <div class="absolute top-4 left-4 z-10 bg-black/85 border border-neutral-800 rounded-xl px-3.5 py-2 font-mono text-xs font-bold text-amber-400 backdrop-blur-md shadow-2xl flex items-center gap-2 pointer-events-none">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Secure SDK Telemetry Active</span>
            </div>
        </div>
    </main>

    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp({
                apiKey: "AIzaSyAfT3ZCE8DEmjsf4FLIqDgdYIQL1woIJOI",
                authDomain: "seemydriver-prod.firebaseapp.com",
                databaseURL: "https://seemydriver-prod-default-rtdb.firebaseio.com",
                projectId: "seemydriver-prod",
                storageBucket: "seemydriver-prod.firebasestorage.app",
                messagingSenderId: "16366013329",
                appId: "1:16366013329:web:7e993e6ee37f940a04a064"
            });
        }

        const db = firebase.database();
        const auth = firebase.auth();
        auth.signInAnonymously().catch(err => console.error("Auth error:", err));

        const FULL_MAPBOX_TOKEN = "pk.eyJ1Ijoic29ubnlqb25lczIwMTQiLCJhIjoiY212NHExMmxjMTBmODJ3cHh5cmcxbmZyZSJ9.wq8EANp8vooYz3gE2o4Krg";
        mapboxgl.accessToken = FULL_MAPBOX_TOKEN;

        let fleetMap = null;
        let activeMarkers = {};
        let selectedCoords = { lat: 30.0024, lng: -95.2821 };
        const companyUuid = "default_fleet";
        let isFleetView = false;

        window.toggleAppView = function() {
            isFleetView = !isFleetView;
            const soloView = document.getElementById("view-solo");
            const fleetView = document.getElementById("view-fleet");
            const toggleBtn = document.getElementById("btn-toggle-view");
            const titleLabel = document.getElementById("view-title-label");

            if (isFleetView) {
                soloView.classList.add("hidden");
                fleetView.classList.remove("hidden");
                toggleBtn.textContent = "✕ Close Fleet";
                toggleBtn.className = "bg-neutral-900 hover:bg-neutral-800 text-neutral-300 hover:text-white border border-neutral-800 font-bold text-xs px-4 py-2 rounded-xl transition cursor-pointer shadow-lg";
                titleLabel.textContent = "Fleet Command Center v76";

                if (!fleetMap) {
                    setTimeout(() => {
                        fleetMap = new mapboxgl.Map({
                            container: "fleet-map-container",
                            style: {
                                version: 8,
                                sources: { "osm": { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256 } },
                                layers: [{ id: "osm-raster", type: "raster", source: "osm" }]
                            },
                            center: [-95.2821, 30.0024],
                            zoom: 13,
                            pitch: 45,
                            bearing: -10,
                            antialias: true
                        });
                        fleetMap.addControl(new mapboxgl.NavigationControl(), "top-right");
                        fleetMap.resize();
                    }, 100);
                } else {
                    setTimeout(() => { fleetMap.resize(); }, 100);
                }
            } else {
                fleetView.classList.add("hidden");
                soloView.classList.remove("hidden");
                toggleBtn.textContent = "🚀 Switch to Fleet Command";
                toggleBtn.className = "bg-amber-400 hover:bg-amber-300 text-black font-black text-xs px-4 py-2 rounded-xl transition cursor-pointer shadow-lg";
                titleLabel.textContent = "Solo Broadcast Mode";
            }
        };

        window.startSoloBroadcast = async function() {
            const driverName = (document.getElementById("solo-driver-name").value || "Driver").trim();
            const destAddress = document.getElementById("solo-destination").value || "Destination";
            const sessionId = "driver_" + driverName.toLowerCase().replace(/[^a-z0-9]/g, "_");

            const sessionData = {
                driverName,
                destAddress,
                lat: selectedCoords.lat,
                lng: selectedCoords.lng,
                speed: 0,
                heading: 0,
                timestamp: Date.now()
            };

            try {
                await db.ref("broadcasts/" + sessionId).set(sessionData);
                alert("🟢 Solo broadcast live for " + driverName + "!");
            } catch (err) {
                alert("Broadcast write failed: " + err.message);
            }
        };

        function createTruckSvgMarker() {
            const el = document.createElement("div");
            el.style.width = "44px";
            el.style.height = "44px";
            el.style.display = "flex";
            el.style.alignItems = "center";
            el.style.justifyContent = "center";
            el.style.filter = "drop-shadow(0px 10px 14px rgba(0,0,0,0.8))";
            el.style.cursor = "pointer";
            el.innerHTML = '<svg viewBox="0 0 24 36" width="34" height="50" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="11" width="17" height="22" rx="3" fill="#1f2937" stroke="#fbbf24" stroke-width="1.25"/><rect x="3.5" y="20" width="17" height="4" fill="#f59e0b"/><path d="M5.5 11H18.5V5C18.5 3.34315 17.1569 2 15.5 2H8.5C6.84315 2 5.5 3.34315 5.5 5V11Z" fill="#111827" stroke="#374151" stroke-width="1.25"/><path d="M7 7.5H17L16 4H8L7 7.5Z" fill="#38bdf8" fill-opacity="0.95"/></svg>';
            return el;
        }

        function renderTruckDirectly(sessionId, sessionData) {
            const lat = parseFloat(sessionData.lat);
            const lng = parseFloat(sessionData.lng);
            if (isNaN(lat) || isNaN(lng)) return;

            if (fleetMap) {
                if (activeMarkers[sessionId]) {
                    activeMarkers[sessionId].marker.setLngLat([lng, lat]);
                } else {
                    const el = createTruckSvgMarker();
                    const marker = new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(fleetMap);
                    activeMarkers[sessionId] = { marker };
                }
            }

            const rosterContainer = document.getElementById("fleet-roster-container");
            if (rosterContainer) {
                const existingCard = document.getElementById("card_" + sessionId);
                if (existingCard) existingCard.remove();

                const card = document.createElement("div");
                card.id = "card_" + sessionId;
                card.className = "bg-[#12141c] border border-neutral-800 rounded-xl p-3 flex flex-col gap-2 shadow-md";
                card.innerHTML = '<div class="flex justify-between items-center text-xs"><span class="font-bold text-white">' + (sessionData.driverName || "Driver") + '</span><span class="text-amber-400 font-mono font-bold">' + (sessionData.speed || 0) + ' mph</span></div><div class="text-[11px] text-neutral-400 truncate">Dest: <span class="text-neutral-200">' + (sessionData.destAddress || "N/A") + '</span></div><div class="flex justify-between items-center pt-1 border-t border-neutral-900 text-[10px]"><span class="text-emerald-400 font-mono">Secure SDK Telemetry</span><button onclick="window.terminateSession(\'' + sessionId + '\')" class="text-red-400 hover:text-red-300 font-bold cursor-pointer">End Run</button></div>';
                rosterContainer.appendChild(card);
            }

            const activeCountEl = document.getElementById("active-count");
            if (activeCountEl) {
                activeCountEl.textContent = Object.keys(activeMarkers).length + " Active";
            }
        }

        window.handleDeployTruckOnly = async function() {
            const driverName = (document.getElementById("input-driver-name").value || "Driver").trim();
            const destAddress = (document.getElementById("input-destination").value || "Destination").trim();
            const sessionId = "driver_" + driverName.toLowerCase().replace(/[^a-z0-9]/g, "_");

            const sessionData = {
                driverName,
                destAddress,
                lat: selectedCoords.lat,
                lng: selectedCoords.lng,
                speed: 0,
                heading: 0,
                timestamp: Date.now()
            };

            renderTruckDirectly(sessionId, sessionData);

            try {
                await db.ref("broadcasts/" + sessionId).set(sessionData);
            } catch (err) {
                console.error("Firebase write error:", err);
            }

            if (fleetMap) {
                fleetMap.flyTo({ center: [selectedCoords.lng, selectedCoords.lat], zoom: 15, pitch: 45, duration: 1500 });
            }
        };

        window.handleDeployAndTextDriver = async function() {
            window.handleDeployTruckOnly();
            const driverPhone = document.getElementById("input-driver-phone").value || "";
            const destAddress = document.getElementById("input-destination").value || "";
            const clientPhone = document.getElementById("input-customer-phone").value || "";
            const driverName = document.getElementById("input-driver-name").value || "Driver";
            const sessionId = "driver_" + driverName.toLowerCase().replace(/[^a-z0-9]/g, "_");

            const driverBroadcastUrl = window.location.origin + "/fleet/driver-broadcast.html?comp=" + companyUuid + "&session=" + sessionId;
            const smsBody = encodeURIComponent("SeeMyDriver Dispatch: Your destination is " + destAddress + ". Open your driver broadcast console here: " + driverBroadcastUrl);
            window.open("sms:" + driverPhone + "?body=" + smsBody);
        };

        window.terminateSession = async function(sessionId) {
            await db.ref("broadcasts/" + sessionId).remove();
            if (activeMarkers[sessionId]) {
                activeMarkers[sessionId].marker.remove();
                delete activeMarkers[sessionId];
            }
            const card = document.getElementById("card_" + sessionId);
            if (card) card.remove();
            const activeCountEl = document.getElementById("active-count");
            if (activeCountEl) {
                activeCountEl.textContent = Object.keys(activeMarkers).length + " Active";
            }
        };
    </script>
</body>
</html>
