<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090a0f">
    <meta name="color-scheme" content="dark">
    <title>SeeMyDriver - Live Telemetry Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        .truck-marker-container { transition: transform 0.3s ease-out; }
    </style>
    <script>
        const SafeStorage = {
            getItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem(key, value) { try { localStorage.setItem(key, value); } catch (e) {} },
            removeItem(key) { try { localStorage.removeItem(key); } catch (e) {} }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyAft3ZCE8DEmjsf4FLIQDgdYIQL1woIJOI",
            authDomain: "seemydriver-prod.firebaseapp.com",
            databaseURL: "https://seemydriver-prod-default-rtdb.firebaseio.com",
            projectId: "seemydriver-prod",
            storageBucket: "seemydriver-prod.firebasestorage.app",
            messagingSenderId: "16366013329",
            appId: "1:16366013329:web:7e993e6ee37f940a04a064"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        try { db.goOnline(); } catch (e) {}
    </script>
    <!-- Modular Scripts -->
    <script src="js/tracker.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body class="bg-[#090a0f] text-neutral-100 min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-black">

    <header class="w-full max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between border-b border-neutral-900 bg-[#090a0f]/85 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <span class="text-[28px] font-black tracking-tight text-white cursor-pointer flex items-center gap-2" onclick="switchView('signin')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-black text-xl font-black">👀</div>
                <span>See<span class="text-amber-400">My</span>Driver</span>
            </span>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col items-center justify-center">
        <!-- SIGN IN VIEW -->
        <div id="signin-view" class="w-full flex flex-col gap-3 hidden">
            <h2 class="text-3xl font-black text-white text-center">Welcome Back 👋</h2>
            <div class="bg-[#12141c] border border-neutral-800 p-5 rounded-3xl flex flex-col gap-3 shadow-xl">
                <input type="email" id="signin-email" placeholder="Email" class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white">
                <input type="password" id="signin-password" placeholder="Password" class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white">
                <button onclick="switchView('job-setup'); SafeStorage.setItem('smd_is_logged_in', 'true');" class="w-full bg-amber-400 text-black font-black text-xs py-3.5 rounded-xl shadow-md">Sign In →</button>
            </div>
        </div>
        <!-- JOB SETUP VIEW -->
        <div id="job-setup-view" class="w-full flex flex-col gap-3 hidden">
            <h2 class="text-2xl font-black text-white text-center">Customer & Destination</h2>
            <div class="bg-[#12141c] border border-neutral-800 p-5 rounded-3xl flex flex-col gap-3 shadow-xl">
                <input type="text" id="job-driver-name" placeholder="Driver Name" class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white">
                <input type="tel" id="job-driver-phone" placeholder="Driver Phone" class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white">
                <input type="text" id="job-cust-name" placeholder="Client Name" class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white">
                <div>
                    <input type="text" id="job-cust-address" placeholder="Destination Address (e.g. 1300 Baker St Houston)" autocomplete="street-address" class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white">
                </div>
                <button onclick="launchLiveBroadcast()" class="w-full bg-amber-400 text-black font-black text-xs py-3.5 rounded-xl shadow-md mt-1">Start Cloud Broadcast 🚀</button>
            </div>
        </div>
        <!-- ACTIVE BROADCAST VIEW -->
        <div id="active-broadcast-view" class="w-full flex flex-col gap-3 hidden">
            <div class="bg-[#12141c] border border-neutral-800 p-4 rounded-3xl flex flex-col gap-3 shadow-xl">
                <div class="w-full bg-[#161923] rounded-2xl overflow-hidden relative h-56 border border-neutral-800">
                    <div id="driver-map-container" style="width:100%; height:100%;"></div>
                    <div class="absolute bottom-2 left-2 z-[1000] bg-black/80 px-2.5 py-1 rounded-lg text-[10px] font-bold text-amber-400">
                        Speed: <span id="driver-map-speed" class="text-white">0 mph</span>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="fitDriverMap()" class="bg-[#161923] border border-neutral-800 text-white text-[11px] font-bold py-2.5 rounded-xl shadow">📍 Fit Both</button>
                    <button onclick="recenterDriverMap()" class="bg-[#161923] border border-neutral-800 text-white text-[11px] font-bold py-2.5 rounded-xl shadow">🎯 Recenter</button>
                    <button onclick="openDriverDirections()" class="bg-amber-400 text-black text-[11px] font-black py-2.5 rounded-xl shadow-md">🗺️ Directions</button>
                </div>
                <input type="text" id="tracking-link-output" readonly class="w-full bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2 text-xs text-amber-400 font-mono">
                <div class="flex gap-2">
                    <button onclick="copyTrackingLink()" class="flex-1 bg-[#161923] text-white font-bold text-xs py-2.5 rounded-xl border border-neutral-800">Copy Link</button>
                    <button onclick="textTrackingLink()" class="flex-1 bg-emerald-500 text-black font-bold text-xs py-2.5 rounded-xl">💬 Text SMS</button>
                </div>
                <button onclick="endBroadcastAndHome()" class="w-full bg-neutral-800 text-neutral-300 font-bold text-xs py-2.5 rounded-xl">← End Broadcast</button>
            </div>
        </div>
        <!-- CUSTOMER VIEW -->
        <div id="customer-view-view" class="w-full flex flex-col gap-3 hidden">
            <div class="bg-amber-500/20 border border-amber-400/40 p-3.5 rounded-2xl flex justify-between items-center">
                <div><div class="text-[9px] font-bold text-amber-400 uppercase">ETA</div><div id="cust-eta" class="text-lg font-black text-white">--</div></div>
                <div class="text-right"><div class="text-[9px] font-bold text-neutral-400 uppercase">Distance</div><div id="cust-distance" class="text-xs font-black text-white">--</div></div>
            </div>
            <div class="bg-[#12141c] border border-neutral-800 rounded-3xl overflow-hidden relative h-72 shadow-xl">
                <div id="customer-map-container" style="width:100%; height:100%;"></div>
                <div class="absolute bottom-3 left-3 z-[1000] bg-black/80 px-2.5 py-1 rounded-lg text-xs font-bold text-amber-400">
                    Speed: <span id="cust-speed" class="text-white">0 mph</span>
                </div>
            </div>
            <!-- CUSTOMER MAP CONTROL BUTTONS -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="fitCustomerMap()" class="bg-[#161923] hover:bg-[#1e2230] border border-neutral-800 text-white text-[11px] font-bold py-2.5 rounded-xl transition cursor-pointer text-center shadow">
                    📍 Fit Both
                </button>
                <button onclick="recenterCustomerMap()" class="bg-[#161923] hover:bg-[#1e2230] border border-neutral-800 text-white text-[11px] font-bold py-2.5 rounded-xl transition cursor-pointer text-center shadow">
                    🎯 Recenter
                </button>
            </div>
            <div class="bg-[#12141c] border border-neutral-800 p-4 rounded-3xl flex justify-between items-center">
                <div><span class="text-[9px] font-bold text-neutral-400 block uppercase">Driver</span><span id="cust-driver-name" class="text-xs font-black text-white">--</span></div>
                <div class="text-right"><span class="text-[9px] font-bold text-neutral-400 block uppercase">Destination</span><span id="cust-destination" class="text-xs font-bold text-amber-400 truncate max-w-[180px] block">--</span></div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto px-4 py-3 text-center border-t border-neutral-900 text-neutral-500 text-[10px]">
        © 2026 SeeMyDriver. All rights reserved.
    </footer>
</body>
</html>
