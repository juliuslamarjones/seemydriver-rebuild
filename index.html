<!-- ACTIVE BROADCAST VIEW (SOLO STEP 2) -->
<div id="active-broadcast-view" class="w-full max-w-md flex flex-col items-center text-center gap-3" style="display: none !important;">
    <div class="inline-flex items-center gap-1.5 bg-emerald-400/10 border border-emerald-400/30 text-emerald-400 font-black text-[11px] px-3 py-1 rounded-full uppercase tracking-wide mb-1">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>🚀 Live Dispatch Active</span>
    </div>
    <div class="w-full bg-[#12141c] border border-neutral-800 p-4 rounded-3xl text-left flex flex-col gap-3 shadow-xl">
        
        <!-- Map Container -->
        <div id="driver-map-container" class="w-full rounded-2xl overflow-hidden border border-neutral-800 shadow-inner"></div>

        <!-- Bottom Controls & Speed Bar -->
        <div class="flex items-center justify-between gap-2 mt-1">
            <div class="grid grid-cols-4 gap-1.5 flex-1">
                <button onclick="window.recenterMap()" class="bg-[#161923] hover:bg-[#1e2230] border border-neutral-800 text-neutral-300 hover:text-amber-400 text-[10px] font-bold py-2.5 px-1 rounded-xl transition flex items-center justify-center cursor-pointer">Recenter</button>
                <button onclick="window.fitBothMap()" class="bg-[#161923] hover:bg-[#1e2230] border border-neutral-800 text-neutral-300 hover:text-amber-400 text-[10px] font-bold py-2.5 px-1 rounded-xl transition flex items-center justify-center cursor-pointer">Fit Both</button>
                <button onclick="window.openDirections()" class="bg-[#161923] hover:bg-[#1e2230] border border-neutral-800 text-neutral-300 hover:text-amber-400 text-[10px] font-bold py-2.5 px-1 rounded-xl transition flex items-center justify-center cursor-pointer">Directions</button>
                <button onclick="window.endBroadcastAndHome()" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 font-bold text-[10px] py-2.5 px-1 rounded-xl transition flex items-center justify-center cursor-pointer">End</button>
            </div>
            <div class="bg-[#161923] border border-neutral-800 rounded-xl px-3 py-2 text-right min-w-[70px]">
                <div class="text-[9px] text-neutral-400 uppercase font-bold">Speed</div>
                <div id="driver-map-speed" class="text-xs font-black text-amber-400">0 mph</div>
            </div>
        </div>
    </div>
</div>
